# Runs exactly the Definition-of-done commands (CLAUDE.md header), so local green means CI green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      # Same pinned image as docker-compose.yml, for the cache and migration tests (CLAUDE.md §9).
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cheiron
          POSTGRES_PASSWORD: cheiron
          POSTGRES_DB: cheiron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheiron -d cheiron"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cheiron:cheiron@127.0.0.1:5432/cheiron
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no moving major tag is published
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The types are generated from the backend's OpenAPI schema, so schemas.py stays the
      # single source; a model change without regenerated types fails here.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
        working-directory: .
      - name: Types match the backend
        run: npm run check:types
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
