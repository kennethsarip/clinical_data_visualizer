[project]
name = "cheiron-task"
version = "0.1.0"
description = "ClinicalTrials.gov query-to-visualization agent (backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "eval", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests hit the real API; the Definition of done stays offline. Run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real ClinicalTrials.gov API (run with -m live)"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
